<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Click Computers | Premium Sales & Service</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #03050d; color: white; overflow-x: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .animate-slide-in-right { animation: slideInRight 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        
        @keyframes pulse-slow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .animate-pulse-slow { animation: pulse-slow 3s infinite; }
        
        ::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbxVemzlfo2MEBg45kAyWRIPxbHfor9MokQ7RZJAtf-GsCVbBNs6BIHZql-4QM_S8eeV/exec"; 

        const PRODUCTS = [
            { id: 1, name: "Corsair Vengeance 16GB DDR5 RAM", category: "Components", price: 21990, image: "https://images.unsplash.com/photo-1562976540-1502c2145186?auto=format&fit=crop&w=400&q=80", rating: 4.8, reviews: 124 },
            { id: 2, name: "Crucial P3 Plus 1TB NVMe SSD", category: "Components", price: 19000, image: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=400&q=80", rating: 4.9, reviews: 89 },
            { id: 3, name: "Logitech G502 Hero Gaming Mouse", category: "Accessories", price: 3390, image: "https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&w=400&q=80", rating: 4.7, reviews: 312 },
            { id: 4, name: "GIGABYTE 25-Inch IPS FHD 240Hz Monitor", category: "Displays", price: 11499, image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=400&q=80", rating: 4.5, reviews: 67 },
            { id: 5, name: "Ant Esports MK1300 V2 Mechanical Keyboard", category: "Accessories", price: 1550, image: "https://images.unsplash.com/photo-1595044426077-d36d9236d54a?auto=format&fit=crop&w=400&q=80", rating: 4.6, reviews: 145 },
            { id: 6, name: "ASUS Dual RX 7600 EVO 8GB GPU", category: "Components", price: 26075, image: "https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=400&q=80", rating: 4.8, reviews: 42 },
            { id: 7, name: "Apple iMac 24-inch (M3)", category: "Desktops", price: 134900, image: "https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?auto=format&fit=crop&w=400&q=80", rating: 4.9, reviews: 28 },
            { id: 8, name: "Portronics Toad 27 Wireless Mouse", category: "Accessories", price: 322, image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?auto=format&fit=crop&w=400&q=80", rating: 4.2, reviews: 512 }
        ];

        const SERVICES = [
            { title: "Chip-Level Laptop & Motherboard Repair", desc: "Expert micro-soldering, short-circuit troubleshooting, and power IC replacement.", icon: "fa-microchip" },
            { title: "MacBook Specialist Services", desc: "Logic board repairs, battery replacements, and display assembly for Apple MacBooks.", icon: "fa-apple-whole" },
            { title: "Custom Gaming PC Assemblies", desc: "Tailored liquid-cooled gaming rigs, workstation builds, and component optimization.", icon: "fa-gamepad" },
            { title: "Refurbished Business Laptops", desc: "Enterprise-grade Dell, HP, and Lenovo laptops with rigorous multi-point testing.", icon: "fa-laptop" },
            { title: "Data Recovery Services", desc: "Advanced data extraction from failed hard drives, corrupted SSDs, and dead storage devices.", icon: "fa-database" },
            { title: "CCTV & Security Solutions", desc: "High-definition commercial and residential surveillance installations and maintenance.", icon: "fa-video" }
        ];

        const CATEGORIES = ["All", "Components", "Accessories", "Displays", "Desktops"];
        const STATUS_OPTIONS = ["Received", "Diagnosing", "Repairing", "Ready for Pickup", "Delivered"];
        const CURRENT_YEAR = new Date().getFullYear();
        const PREFIX = `RC${CURRENT_YEAR}`;

        const REVIEW_TEMPLATES = [
            "Right Click Computers provided an amazing service! My laptop works like new.",
            "Highly professional and fast repairs. Excellent experience with Right Click.",
            "Custom gaming PC assembly was flawless. Very satisfied with the expertise.",
            "MacBook screen replacement done quickly and efficiently. Great team!"
        ];

        const getTodayYYYYMMDD = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const parseTicketFields = (ticket) => {
            if (!ticket) {
                return { customer: "", mobile: "", device: "", issue: "", remarks: "", status: "Received", date: "", cost: "Pending", deliveredAt: null };
            }

            let customer = "";
            let mobile = "";
            let device = "";
            let issue = "";
            let remarks = "";
            let status = "Received";
            let date = "";
            let cost = "Pending";
            let deliveredAt = null;

            if (Array.isArray(ticket)) {
                customer = ticket || ticket[0] || "";
                mobile = ticket || "";
                device = ticket || "";
                issue = ticket || "";
                remarks = ticket || "";
                status = ticket || "Received";
                date = ticket[7] || "";
                cost = ticket[8] || "Pending";
                deliveredAt = ticket[9] || null;
            } else if (typeof ticket === 'object') {
                customer = ticket.customer ? String(ticket.customer).trim() : "";
                mobile = ticket.mobile ? String(ticket.mobile).trim() : "";
                device = ticket.device ? String(ticket.device).trim() : "";
                issue = ticket.issue ? String(ticket.issue).trim() : "";
                remarks = ticket.remarks ? String(ticket.remarks).trim() : "";
                status = ticket.status ? String(ticket.status).trim() : "Received";
                date = ticket.date ? String(ticket.date).trim() : "";
                cost = ticket.cost ? String(ticket.cost).trim() : "Pending";
                deliveredAt = ticket.deliveredAt || null;
            }

            customer = String(customer).replace(/^RC\d+-\d+/i, '').replace(/,/g, '').trim();
            device = String(device).replace(/^RC\d+-\d+/i, '').replace(/,/g, '').trim();

            let cleanMobile = String(mobile).replace(/\D/g, '');
            if (cleanMobile.length > 10) {
                cleanMobile = cleanMobile.slice(-10);
            }

            return {
                customer: customer || "Customer Name",
                mobile: cleanMobile || String(mobile),
                device: device || "Device Model",
                issue: issue || "",
                remarks: remarks || "",
                status: status || "Received",
                date: date || "",
                cost: cost || "Pending",
                deliveredAt: deliveredAt || null
            };
        };

        const BrandLogo = () => (
            <div className="flex items-center gap-3 cursor-pointer">
                <div className="relative w-10 h-10 drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                        <path d="M12 4L19 19L12 16L12 4Z" fill="#FACC15" />
                        <path d="M12 4L5 19L12 16L12 4Z" fill="#FFFFFF" />
                        <rect x="9.5" y="11" width="5" height="7" rx="2.5" stroke="#18181B" strokeWidth="0.75" fill="transparent"/>
                        <line x1="9.5" y1="14" x2="14.5" y2="14" stroke="#18181B" strokeWidth="0.75"/>
                        <line x1="12" y1="11" x2="12" y2="14" stroke="#18181B" strokeWidth="0.75"/>
                    </svg>
                </div>
                <div className="flex flex-col -gap-1">
                    <div className="flex items-baseline gap-1">
                        <span className="font-black text-2xl tracking-wide text-white">RIGHT</span>
                        <span className="font-bold text-xl text-zinc-300">Click</span>
                    </div>
                    <span className="text-[10px] font-bold tracking-[0.25em] text-yellow-500 uppercase leading-none">Computers</span>
                </div>
            </div>
        );

        function App() {
            const [currentView, setCurrentView] = useState("store");
            const [toastMessage, setToastMessage] = useState("");
            const [isLoadingCloud, setIsLoadingCloud] = useState(false);
            
            const formatDate = (dateStr) => {
                if (!dateStr) return "";
                const str = String(dateStr).trim();
                if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
                    const [y, m, d] = str.split('-');
                    const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
                    if (!isNaN(dateObj.getTime())) {
                        return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    }
                }
                const d = new Date(str);
                if (!isNaN(d.getTime())) return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                return str;
            };

            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [activeCategory, setActiveCategory] = useState("All");
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [isCheckoutModalOpen, setIsCheckoutModalOpen] = useState(false);
            
            const [trackingQuery, setTrackingQuery] = useState("");
            const [searchedTicket, setSearchedTicket] = useState(null);
            const [searchedTicketId, setSearchedTicketId] = useState("");
            const [trackingError, setTrackingError] = useState("");
            
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [loginUsername, setLoginUsername] = useState("");
            const [loginPassword, setLoginPassword] = useState("");
            const [loginError, setLoginError] = useState("");
            const [adminSearch, setAdminSearch] = useState("");
            const [adminStatusFilter, setAdminStatusFilter] = useState("All");

            const [ticketsData, setTicketsData] = useState({});
            const [editingTicketId, setEditingTicketId] = useState(null);
            const [editFormData, setEditFormData] = useState({});
            
            const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
            const [newTicketForm, setNewTicketForm] = useState({ 
                serialNumber: "", customer: "", mobile: "", device: "", issue: "", remarks: "", cost: "Pending", date: getTodayYYYYMMDD() 
            });

            const [isReviewAssistOpen, setIsReviewAssistOpen] = useState(false);
            const [generatedReview, setGeneratedReview] = useState("");

            const fetchCloudData = (isManual = false) => {
                if (!GOOGLE_SHEETS_API_URL) return;
                setIsLoadingCloud(true);
                fetch(GOOGLE_SHEETS_API_URL)
                    .then(res => res.json())
                    .then(data => {
                        setIsLoadingCloud(false);
                        if (data && typeof data === 'object' && !data.error) {
                            const sanitized = {};
                            for (const key in data) {
                                if (key && key.toLowerCase() !== "error") {
                                    sanitized[key] = parseTicketFields(data[key]);
                                }
                            }
                            setTicketsData(sanitized);
                            localStorage.setItem("rightclick_tickets", JSON.stringify(sanitized));
                            if (isManual) showToast("Synchronized with Google Sheet!");
                        }
                    })
                    .catch(err => {
                        setIsLoadingCloud(false);
                        console.error("Failed to connect to Google Sheets backend:", err);
                    });
            };

            useEffect(() => {
                localStorage.removeItem("rightclick_tickets");
                fetchCloudData(false);
            }, []);

            const saveDataToCloudOrLocal = (data) => {
                setTicketsData(data); 
                localStorage.setItem("rightclick_tickets", JSON.stringify(data));
                if (GOOGLE_SHEETS_API_URL) {
                    fetch(GOOGLE_SHEETS_API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(data)
                    }).catch(err => console.error("Cloud Save Error:", err));
                }
            };

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 3000);
            };

            const filteredProducts = useMemo(() => {
                if (activeCategory === "All") return PRODUCTS;
                return PRODUCTS.filter(p => p.category === activeCategory);
            }, [activeCategory]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    return [...prev, { ...product, quantity: 1 }];
                });
                showToast(`Added ${product.name} to cart`);
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) return { ...item, quantity: Math.max(0, item.quantity + delta) };
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const formatINR = (amount) => {
                const numeric = Number(String(amount).replace(/[^0-9.-]+/g, ""));
                if (isNaN(numeric) || numeric === 0) return String(amount);
                return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(numeric);
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (loginUsername.toLowerCase().trim() === 'rightclick' && loginPassword.trim() === '9059895427') {
                    setIsAdminAuthenticated(true);
                    setLoginError(''); setLoginUsername(''); setLoginPassword('');
                    fetchCloudData(false);
                    showToast("Staff Access Granted");
                } else {
                    setLoginError("Invalid username or password.");
                }
            };

            const handleAdminLogout = () => {
                setIsAdminAuthenticated(false);
                setCurrentView('store');
                showToast("Logged out successfully");
            };

            const handleCreateTicket = (e) => {
                e.preventDefault();
                const cleanSerial = newTicketForm.serialNumber.trim().toUpperCase().replace(/^RC\d*-?/, '');
                const customId = `${PREFIX}-${cleanSerial}`;
                
                if (ticketsData[customId]) { 
                    showToast("Error: Ticket ID already exists!"); 
                    return; 
                }

                const newTicket = {
                    customer: newTicketForm.customer.trim(), 
                    mobile: newTicketForm.mobile.replace(/\D/g, ''),
                    device: newTicketForm.device.trim(), 
                    issue: newTicketForm.issue.trim(), 
                    remarks: newTicketForm.remarks.trim(), 
                    status: "Received", 
                    date: newTicketForm.date || getTodayYYYYMMDD(), 
                    cost: newTicketForm.cost ? newTicketForm.cost.trim() : "Pending",
                    deliveredAt: null
                };

                const updatedData = { ...ticketsData, [customId]: newTicket };
                saveDataToCloudOrLocal(updatedData);
                
                setIsCreateModalOpen(false);
                setNewTicketForm({ serialNumber: "", customer: "", mobile: "", device: "", issue: "", remarks: "", cost: "Pending", date: getTodayYYYYMMDD() });
                showToast(`Created: ${customId}`);
            };

            const startEditingTicket = (id, ticket) => {
                setEditingTicketId(id);
                setEditFormData({ ...ticket });
            };

            const saveTicketEdit = (id) => {
                const updatedTicket = parseTicketFields(editFormData);
                if (updatedTicket.status === 'Delivered' && ticketsData[id]?.status !== 'Delivered') {
                    updatedTicket.deliveredAt = Date.now();
                } else if (updatedTicket.status !== 'Delivered') {
                    updatedTicket.deliveredAt = null;
                }
                const updatedData = { ...ticketsData, [id]: updatedTicket };
                saveDataToCloudOrLocal(updatedData);
                setEditingTicketId(null);
                showToast(`Saved updates for ${id}`);
            };

            const sendCustomerNotification = (ticket, id) => {
                let mobileClean = String(ticket.mobile).replace(/\D/g, '');
                if (mobileClean.length === 10) {
                    mobileClean = '91' + mobileClean;
                }

                let message = `Hello *${ticket.customer}*, this is an update from *Right Click Computers*!\n\n`;
                message += `*Ticket ID:* ${id}\n`;
                message += `*Device:* ${ticket.device}\n`;
                message += `*Current Status:* ${ticket.status}\n`;
                
                if (ticket.cost && ticket.cost.toLowerCase() !== 'pending') {
                    message += `*Estimated Cost:* ${formatINR(ticket.cost)}\n`;
                }

                if (ticket.status === 'Ready for Pickup') {
                    message += `\nYour device is repaired and ready for pickup! You can visit our store during business hours.\n`;
                }

                message += `\nTrack your repair live here: https://ri8clickcomputers-sys.github.io/rightclickvizag`;
                
                const url = `https://wa.me/${mobileClean}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
            };

            const processCheckout = () => {
                let orderText = `Hello Right Click Computers! I would like to place an order:%0A%0A`;
                cart.forEach(item => { orderText += `▪ ${item.quantity}x ${item.name} (${formatINR(item.price * item.quantity)})%0A`; });
                orderText += `%0A*Total Value: ${formatINR(cartTotal)}*%0A%0AHow should I proceed with payment and pickup?`;
                window.open(`https://wa.me/919059895427?text=${orderText}`, '_blank');
                setIsCheckoutModalOpen(false);
                setCart([]); 
                showToast("Opening WhatsApp...");
            };

            const handleTrackLookup = (e) => {
                e.preventDefault();
                setTrackingError("");
                setSearchedTicket(null);
                setSearchedTicketId("");

                const query = trackingQuery.trim();
                if (!query) {
                    setTrackingError("Please enter your Ticket ID or 10-digit mobile number.");
                    return;
                }

                const cleanDigits = query.replace(/\D/g, '');
                const upperQuery = query.toUpperCase();

                let foundId = null;
                for (const key in ticketsData) {
                    const t = ticketsData[key];
                    const mobileClean = String(t.mobile || '').replace(/\D/g, '');
                    if (key.toUpperCase() === upperQuery || key.toUpperCase() === `${PREFIX}-${upperQuery}`) {
                        foundId = key;
                        break;
                    }
                    if (cleanDigits.length >= 10 && (mobileClean === cleanDigits || mobileClean.endsWith(cleanDigits))) {
                        foundId = key;
                        break;
                    }
                }

                if (foundId) {
                    setSearchedTicket(ticketsData[foundId]);
                    setSearchedTicketId(foundId);
                } else {
                    setTrackingError(`No repair record found for "${query}". Please check your details.`);
                }
            };

            const sortedTicketsList = useMemo(() => {
                const entries = Object.entries(ticketsData || {}).map(([id, t]) => ({ id, ...t }));
                
                const filtered = entries.filter(item => {
                    const matchStatus = adminStatusFilter === "All" || item.status === adminStatusFilter;
                    const q = (adminSearch || "").toLowerCase();
                    const matchQuery = !q || 
                        String(item.id || '').toLowerCase().includes(q) || 
                        String(item.customer || '').toLowerCase().includes(q) || 
                        String(item.mobile || '').includes(q) || 
                        String(item.device || '').toLowerCase().includes(q) ||
                        String(item.issue || '').toLowerCase().includes(q) ||
                        String(item.remarks || '').toLowerCase().includes(q);
                    return matchStatus && matchQuery;
                });

                return filtered.sort((a, b) => {
                    const dateA = new Date(a.date || 0).getTime();
                    const dateB = new Date(b.date || 0).getTime();
                    if (dateB !== dateA) return dateB - dateA;
                    
                    const numA = parseInt(String(a.id || '').replace(/\D/g, '') || '0', 10);
                    const numB = parseInt(String(b.id || '').replace(/\D/g, '') || '0', 10);
                    return numB - numA;
                });
            }, [ticketsData, adminSearch, adminStatusFilter]);

            const getStatusBadge = (status) => {
                switch(status) {
                    case 'Received':
                        return 'bg-blue-500/20 text-blue-400 border border-blue-500/30';
                    case 'Diagnosing':
                        return 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
                    case 'Repairing':
                        return 'bg-purple-500/20 text-purple-400 border border-purple-500/30';
                    case 'Ready for Pickup':
                        return 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 animate-pulse';
                    case 'Delivered':
                        return 'bg-zinc-700/40 text-zinc-400 border border-zinc-600/30';
                    default:
                        return 'bg-zinc-800 text-zinc-300 border border-zinc-700';
                }
            };

            return (
                <div className="min-h-screen flex flex-col relative bg-[#03050d] text-white">
                    
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[9999] bg-zinc-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 animate-bounce border border-yellow-500/50">
                            <i className="fas fa-check-circle text-yellow-400"></i>
                            <span className="font-bold text-sm">{toastMessage}</span>
                        </div>
                    )}

                    {/* Floating Quick Action Buttons */}
                    <div className="fixed bottom-8 right-8 z-50 flex flex-col gap-4">
                        <button 
                            onClick={() => { setGeneratedReview(REVIEW_TEMPLATES[Math.floor(Math.random() * REVIEW_TEMPLATES.length)]); setIsReviewAssistOpen(true); }} 
                            className="w-14 h-14 bg-yellow-400 text-black rounded-full flex items-center justify-center shadow-[0_10px_25px_rgba(0,0,0,0.5)] hover:scale-110 transition-transform animate-pulse-slow"
                            title="Write a Google Review"
                        >
                            <i className="fas fa-star text-2xl"></i>
                        </button>
                        <a 
                            href="https://wa.me/919059895427" 
                            target="_blank" 
                            className="w-14 h-14 bg-[#25d366] text-white rounded-full flex items-center justify-center shadow-[0_10px_25px_rgba(0,0,0,0.5)] hover:scale-110 transition-transform"
                            title="WhatsApp Store Direct"
                        >
                            <i className="fab fa-whatsapp text-3xl"></i>
                        </a>
                    </div>

                    {/* Review Assistant Modal */}
                    {isReviewAssistOpen && (
                        <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setIsReviewAssistOpen(false)}></div>
                            <div className="bg-zinc-900/95 border border-yellow-400/30 backdrop-blur-xl p-8 rounded-3xl w-full max-w-lg relative z-10 animate-slide-in-right shadow-2xl">
                                <button onClick={() => setIsReviewAssistOpen(false)} className="absolute top-4 right-4 text-zinc-400 hover:text-white"><i className="fas fa-times"></i></button>
                                <h2 className="text-2xl font-black text-white mb-2 flex items-center gap-2"><i className="fas fa-star text-yellow-400"></i> Review Assistant</h2>
                                <p className="text-zinc-400 mb-6 text-sm">Help us grow by leaving a quick 5-star Google review!</p>
                                <textarea readOnly value={generatedReview} className="w-full h-32 bg-black/50 border border-yellow-400/20 rounded-xl p-4 text-white font-medium resize-none focus:outline-none focus:border-yellow-400 transition-colors mb-4"/>
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(generatedReview); showToast("Copied to clipboard!"); }} className="flex-1 bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-3 rounded-xl flex items-center justify-center gap-2"><i className="fas fa-copy"></i> Copy Review</button>

                                                <button onClick={() => fetchCloudData(true)} className="bg-white/10 hover:bg-white/20 text-white font-bold px-4 py-3 rounded-xl border border-white/10 flex items-center gap-2" title="Reload from Google Sheets">
                                                    <i className={`fas fa-rotate ${isLoadingCloud ? 'fa-spin' : ''}`}></i> Sync Sheet
                                                </button>
                                                <button onClick={() => setIsCreateModalOpen(true)} className="bg-yellow-400 hover:bg-yellow-500 text-black font-extrabold px-6 py-3 rounded-xl flex items-center gap-2 shadow-[0_0_15px_rgba(250,204,21,0.3)]">
                                                    <i className="fas fa-plus"></i> New Ticket
                                                </button>
                                                <button onClick={handleAdminLogout} className="bg-white/10 hover:bg-white/20 text-white font-bold px-5 py-3 rounded-xl border border-white/10 flex items-center gap-2">
                                                    <i className="fas fa-sign-out-alt"></i> Logout
                                                </button>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                            <div className="md:col-span-2">
                                                <input 
                                                    type="text" 
                                                    value={adminSearch} 
                                                    onChange={e => setAdminSearch(e.target.value)} 
                                                    placeholder="Search by Ticket ID, Customer, Phone, or Device..." 
                                                    className="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-white font-medium focus:outline-none focus:border-yellow-400"
                                                />
                                            </div>
                                            <div>
                                                <select 
                                                    value={adminStatusFilter} 
                                                    onChange={e => setAdminStatusFilter(e.target.value)} 
                                                    className="w-full bg-zinc-900 border border-white/10 rounded-2xl px-5 py-3.5 text-white font-medium focus:outline-none focus:border-yellow-400"
                                                >
                                                    <option value="All">All Statuses ({Object.keys(ticketsData || {}).length})</option>
                                                    {STATUS_OPTIONS.map(st => (
                                                        <option key={st} value={st}>{st}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        {/* TIGHT, WELL-PROPORTIONED TABLE */}
                                        <div className="bg-zinc-900/90 border border-white/10 rounded-3xl overflow-hidden shadow-2xl">
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse table-auto">
                                                    <thead>
                                                        <tr className="bg-black/50 border-b border-white/10 text-zinc-400 text-xs uppercase tracking-wider">
                                                            <th className="py-4 px-5 font-extrabold w-36">Ticket ID & Date</th>
                                                            <th className="py-4 px-5 font-extrabold w-48">Customer Info</th>
                                                            <th className="py-4 px-5 font-extrabold">Device & Remarks</th>
                                                            <th className="py-4 px-5 font-extrabold w-36 text-center">Status</th>
                                                            <th className="py-4 px-5 font-extrabold w-28 text-right">Cost (INR)</th>
                                                            <th className="py-4 px-5 font-extrabold w-32 text-right">Actions</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-white/5 text-sm">
                                                        {sortedTicketsList.length === 0 ? (
                                                            <tr>
                                                                <td colSpan="6" className="py-12 text-center text-zinc-500 font-medium">No tickets found in database.</td>
                                                            </tr>
                                                        ) : (
                                                            sortedTicketsList.map(ticket => {
                                                                const isEditing = editingTicketId === ticket.id;

                                                                if (isEditing) {
                                                                    return (
                                                                        <tr key={ticket.id} className="bg-yellow-400/5">
                                                                            <td className="py-4 px-5 align-top">
                                                                                <span className="font-black text-white block">{ticket.id}</span>
                                                                                <input 
                                                                                    type="date" 
                                                                                    value={editFormData.date || ""} 
                                                                                    onChange={e => setEditFormData({ ...editFormData, date: e.target.value })} 
                                                                                    className="mt-1 bg-black border border-white/20 rounded p-1 text-xs text-white w-full"
                                                                                />
                                                                            </td>
                                                                            <td className="py-4 px-5 align-top">
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={editFormData.customer || ""} 
                                                                                    onChange={e => setEditFormData({ ...editFormData, customer: e.target.value })} 
                                                                                    placeholder="Customer Name"
                                                                                    className="w-full bg-black border border-white/20 rounded p-1.5 text-xs text-white mb-1"
                                                                                />
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={editFormData.mobile || ""} 
                                                                                    onChange={e => setEditFormData({ ...editFormData, mobile: e.target.value })} 
                                                                                    placeholder="10-digit Phone"
                                                                                    className="w-full bg-black border border-white/20 rounded p-1.5 text-xs text-white"
                                                                                />
                                                                            </td>
                                                                            <td className="py-4 px-5 align-top">
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={editFormData.device || ""} 
                                                                                    onChange={e => setEditFormData({ ...editFormData, device: e.target.value })} 
                                                                                    placeholder="Device Model"
                                                                                    className="w-full bg-black border border-white/20 rounded p-1.5 text-xs text-white mb-1"
                                                                                />
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={editFormData.remarks || ""} 
                                                                                    onChange={e => setEditFormData({ ...editFormData, remarks: e.target.value })} 
                                                                                    placeholder="Condition / Remarks"
                                                                                    className="w-full bg-black border border-white/20 rounded p-1.5 text-xs text-white"
                                                                                />
                                                                            </td>
                                                                            <td className="py-4 px-5 align-top text-center">
                                                                                <select 
                                                                                    value={editFormData.status || "Received"} 
                                                                                    onChange={e => setEditFormData({ ...editFormData, status: e.target.value })} 
                                                                                    className="bg-black border border-white/20 rounded p-1.5 text-xs text-white w-full"
                                                                                >
                                                                                    {STATUS_OPTIONS.map(st => (
                                                                                        <option key={st} value={st}>{st}</option>
                                                                                    ))}
                                                                                </select>
                                                                            </td>
                                                                            <td className="py-4 px-5 align-top text-right">
                                                                                <input 
                                                                                    type="text" 
                                                                                    value={editFormData.cost || ""} 
                                                                                    onChange={e => setEditFormData({ ...editFormData, cost: e.target.value })} 
                                                                                    placeholder="3500 or Pending"
                                                                                    className="w-full bg-black border border-white/20 rounded p-1.5 text-xs text-white text-right"
                                                                                />
                                                                            </td>
                                                                            <td className="py-4 px-5 align-top text-right space-x-1">
                                                                                <button onClick={() => saveTicketEdit(ticket.id)} className="bg-emerald-500 hover:bg-emerald-600 text-black font-extrabold px-2.5 py-1.5 rounded-lg text-xs">Save</button>
                                                                                <button onClick={() => setEditingTicketId(null)} className="bg-zinc-700 hover:bg-zinc-600 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs">Cancel</button>
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                }

                                                                return (
                                                                    <tr key={ticket.id} className="hover:bg-white/[0.02] transition-colors">
                                                                        {/* 1. TICKET ID & DATE */}
                                                                        <td className="py-4 px-5 align-middle">
                                                                            <span className="font-black text-white block text-sm tracking-wide">{ticket.id}</span>
                                                                            <span className="text-zinc-400 uppercase text-xs font-semibold">{formatDate(ticket.date)}</span>
                                                                        </td>

                                                                        {/* 2. CUSTOMER INFO */}
                                                                        <td className="py-4 px-5 align-middle">
                                                                            <span className="font-bold text-white block text-sm leading-tight">{ticket.customer}</span>
                                                                            {ticket.mobile && (
                                                                                <a href={`tel:${ticket.mobile}`} className="inline-flex items-center gap-1.5 mt-1 text-xs font-bold text-yellow-400 hover:text-yellow-300 bg-yellow-400/10 px-2 py-0.5 rounded-md border border-yellow-400/20">
                                                                                    <i className="fas fa-phone-alt text-[9px]"></i> {ticket.mobile}
                                                                                </a>
                                                                            )}
                                                                        </td>

                                                                        {/* 3. DEVICE & REMARKS */}
                                                                        <td className="py-4 px-5 align-middle">
                                                                            <span className="font-bold text-zinc-100 block text-sm">{ticket.device}</span>
                                                                            {ticket.remarks && (
                                                                                <span className="text-zinc-400 italic text-xs block truncate max-w-sm mt-0.5" title={ticket.remarks}>
                                                                                    "{ticket.remarks}"
                                                                                </span>
                                                                            )}
                                                                        </td>

                                                                        {/* 4. STATUS */}
                                                                        <td className="py-4 px-5 align-middle text-center">
                                                                            <span className={`inline-block px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider ${getStatusBadge(ticket.status)}`}>
                                                                                {ticket.status}
                                                                            </span>
                                                                        </td>

                                                                        {/* 5. COST */}
                                                                        <td className="py-4 px-5 align-middle font-extrabold text-white text-right text-sm">
                                                                            {ticket.cost && ticket.cost.toLowerCase() !== 'pending' ? formatINR(ticket.cost) : <span className="text-zinc-500 font-normal">Pending</span>}
                                                                        </td>

                                                                        {/* 6. ACTIONS */}
                                                                        <td className="py-4 px-5 align-middle text-right">
                                                                            <div className="flex items-center justify-end gap-1.5">
                                                                                <button 
                                                                                    onClick={() => startEditingTicket(ticket.id, ticket)} 
                                                                                    className="bg-white/10 hover:bg-white/20 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs flex items-center gap-1 border border-white/10"
                                                                                    title="Edit Ticket"
                                                                                >
                                                                                    <i className="fas fa-pen text-[9px]"></i> Edit
                                                                                </button>
                                                                                <button 
                                                                                    onClick={() => sendCustomerNotification(ticket, ticket.id)} 
                                                                                    className="bg-[#25d366]/20 hover:bg-[#25d366]/30 text-[#25d366] font-bold px-2.5 py-1.5 rounded-lg text-xs flex items-center gap-1 border border-[#25d366]/30"
                                                                                    title="Send WhatsApp Update"
                                                                                >
                                                                                    <i className="fab fa-whatsapp text-xs"></i> Notify
                                                                                </button>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                );
                                                            })
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>

                    {/* CREATE TICKET MODAL */}
                    {isCreateModalOpen && (
                        <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setIsCreateModalOpen(false)}></div>
                            <div className="bg-zinc-900 border border-yellow-400/30 p-8 rounded-3xl w-full max-w-xl relative z-10 animate-slide-in-right shadow-2xl max-h-[90vh] overflow-y-auto hide-scrollbar">
                                <button onClick={() => setIsCreateModalOpen(false)} className="absolute top-5 right-5 text-zinc-400 hover:text-white p-2"><i className="fas fa-times"></i></button>
                                <h2 className="text-2xl font-black text-white mb-1 flex items-center gap-2">
                                    <i className="fas fa-plus-circle text-yellow-400"></i> New Repair Ticket
                                </h2>
                                <p className="text-zinc-400 text-xs mb-6">Generated Ticket ID prefix will be <strong className="text-yellow-400">{PREFIX}-###</strong></p>

                                <form onSubmit={handleCreateTicket} className="space-y-4 text-sm">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">Ticket Serial # *</label>
                                            <div className="flex items-center">
                                                <span className="bg-black/60 border border-r-0 border-white/10 px-3 py-3 rounded-l-xl text-zinc-400 font-bold">{PREFIX}-</span>
                                                <input 
                                                    type="text" 
                                                    value={newTicketForm.serialNumber} 
                                                    onChange={e => setNewTicketForm({ ...newTicketForm, serialNumber: e.target.value })} 
                                                    placeholder="798" 
                                                    className="w-full bg-black/50 border border-white/10 rounded-r-xl p-3 text-white font-bold focus:outline-none focus:border-yellow-400" 
                                                    required 
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">Drop-off Date</label>
                                            <input 
                                                type="date" 
                                                value={newTicketForm.date} 
                                                onChange={e => setNewTicketForm({ ...newTicketForm, date: e.target.value })} 
                                                className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-yellow-400" 
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">Customer Name *</label>
                                            <input 
                                                type="text" 
                                                value={newTicketForm.customer} 
                                                onChange={e => setNewTicketForm({ ...newTicketForm, customer: e.target.value })} 
                                                placeholder="e.g. Sai Ram" 
                                                className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-yellow-400" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">10-Digit Mobile Number *</label>
                                            <input 
                                                type="tel" 
                                                value={newTicketForm.mobile} 
                                                onChange={e => setNewTicketForm({ ...newTicketForm, mobile: e.target.value })} 
                                                placeholder="e.g. 9393939376" 
                                                className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-yellow-400" 
                                                required 
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">Device Model *</label>
                                        <input 
                                            type="text" 
                                            value={newTicketForm.device} 
                                            onChange={e => setNewTicketForm({ ...newTicketForm, device: e.target.value })} 
                                            placeholder="e.g. Dell Latitude 5490" 
                                            className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-yellow-400" 
                                            required 
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">Reported Issue</label>
                                        <input 
                                            type="text" 
                                            value={newTicketForm.issue} 
                                            onChange={e => setNewTicketForm({ ...newTicketForm, issue: e.target.value })} 
                                            placeholder="e.g. No Power MB Issue" 
                                            className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-yellow-400" 
                                        />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">Estimated Cost (INR)</label>
                                            <input 
                                                type="text" 
                                                value={newTicketForm.cost} 
                                                onChange={e => setNewTicketForm({ ...newTicketForm, cost: e.target.value })} 
                                                placeholder="e.g. 3500 or Pending" 
                                                className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-yellow-400" 
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-zinc-400 uppercase tracking-wider block mb-1">Diagnostic Remarks</label>
                                            <input 
                                                type="text" 
                                                value={newTicketForm.remarks} 
                                                onChange={e => setNewTicketForm({ ...newTicketForm, remarks: e.target.value })} 
                                                placeholder="e.g. MB Issue" 
                                                className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white font-medium focus:outline-none focus:border-yellow-400" 
                                            />
                                        </div>
                                    </div>

                                    <div className="pt-4 flex gap-3">
                                        <button type="button" onClick={() => setIsCreateModalOpen(false)} className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-3.5 rounded-xl">Cancel</button>
                                        <button type="submit" className="flex-1 bg-yellow-400 hover:bg-yellow-500 text-black font-extrabold py-3.5 rounded-xl shadow-[0_0_15px_rgba(250,204,21,0.3)]">Create & Sync</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Footer with Discreet Staff Portal Link */}
                    <footer className="bg-black border-t border-white/10 mt-auto py-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                                <div className="md:col-span-2">
                                    <BrandLogo />
                                    <p className="text-zinc-400 text-sm mt-4 max-w-sm leading-relaxed">
                                        Premier IT hardware sales, custom gaming PC configurations, and chip-level diagnostic center located in Madhurawada, Visakhapatnam.
                                    </p>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-3">Store Location</h4>
                                    <p className="text-zinc-400 text-xs leading-relaxed">
                                        Annapurna Arcade, Above SBI Bank,<br/>
                                        PM Palem Main Road, Midhilapuri Vuda Layout,<br/>
                                        Madhurawada, Visakhapatnam (Vizag),<br/>
                                        Andhra Pradesh 530041, India
                                    </p>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold text-sm uppercase tracking-wider mb-3">Direct Contact</h4>
                                    <p className="text-zinc-400 text-xs mb-2"><i className="fas fa-phone text-yellow-400 mr-2"></i> +91 90598 95427</p>
                                    <p className="text-zinc-400 text-xs mb-4"><i className="fas fa-clock text-yellow-400 mr-2"></i> Mon - Sat: 10:00 AM - 9:00 PM</p>
                                    <button 
                                        onClick={() => { setCurrentView('admin'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} 
                                        className="text-xs text-zinc-500 hover:text-yellow-400 transition-colors"
                                    >
                                        Staff Portal Access &rarr;
                                    </button>
                                </div>
                            </div>
                            <div className="pt-8 border-t border-white/5 text-center text-zinc-600 text-xs">
                                &copy; {CURRENT_YEAR} Right Click Computers Sales & Services. All Rights Reserved.
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
